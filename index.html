<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<title> DVM 24-29 — 5th</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233A;
    --ink-soft:#4A5A72;
    --paper:#EDF1F6;
    --paper-raised:#FFFFFF;
    --line:#D7DEE8;
    --gold:#E3A64F;
    --gold-deep:#B97F2E;
    --teal:#2F8F82;
    --teal-deep:#20655C;
    --crimson:#C1443C;
    --crimson-tint:#FBEAE8;
    --radius:14px;
    --shadow:0 1px 2px rgba(22,35,58,.06), 0 6px 16px rgba(22,35,58,.06);
    font-size:16px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:78px;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
  button{font-family:inherit; cursor:pointer;}
  .app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; background:var(--paper);}

  header.top{
    position:sticky; top:0; z-index:30;
    background:rgba(237,241,246,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
    display:flex; align-items:flex-end; justify-content:space-between;
  }
  header.top .titles h1{font-size:1.28rem; font-weight:600; margin:0; line-height:1.1;}
  header.top .titles .sub{font-size:.78rem; color:var(--ink-soft); margin-top:2px; display:flex; gap:8px; align-items:center;}
  .mode-badge{
    font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:20px;
    background:var(--line); color:var(--ink-soft);
  }
  .mode-badge.admin{background:var(--gold); color:#3A2A0C;}
  .gear-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--paper-raised); font-size:1.05rem; display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .gear-btn:active{transform:scale(.9) rotate(25deg);}

  main{padding:18px 18px 30px;}
  .page{animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .hidden{display:none !important;}

  .welcome{margin-bottom:18px;}
  .welcome h2{font-size:1.5rem; margin:0 0 4px; font-weight:600;}
  .welcome p{margin:0; color:var(--ink-soft); font-size:.92rem;}

  .stat-strip{
    display:flex; background:var(--paper-raised); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden; margin-bottom:20px;
  }
  .stat{flex:1; text-align:center; padding:14px 4px; position:relative;}
  .stat:not(:last-child)::after{
    content:""; position:absolute; right:0; top:20%; bottom:20%; width:1px; background:var(--line);
  }
  .stat .num{font-family:'Fraunces',serif; font-size:1.5rem; font-weight:600; display:block;}
  .stat .lbl{font-size:.68rem; color:var(--ink-soft); margin-top:2px; display:block;}

  .section-label{font-size:.95rem; font-weight:600; margin:0 0 10px; color:var(--ink); display:flex; align-items:center; gap:6px;}

  .preview-card{
    background:var(--paper-raised); border-radius:var(--radius); padding:14px 16px;
    box-shadow:var(--shadow); margin-bottom:22px; border-left:4px solid var(--gold);
  }
  .preview-card .t{font-weight:600; margin-bottom:3px;}
  .preview-card .b{font-size:.86rem; color:var(--ink-soft); line-height:1.4; white-space:pre-wrap;}
  .preview-card .d{font-size:.72rem; color:var(--ink-soft); margin-top:6px;}
  .empty-note{font-size:.86rem; color:var(--ink-soft); font-style:italic; padding:6px 2px 20px;}

  .today-row{
    display:flex; align-items:center; gap:12px; padding:11px 14px;
    background:var(--paper-raised); border-radius:10px; margin-bottom:8px; box-shadow:var(--shadow);
  }
  .today-row .time{font-weight:600; font-size:.82rem; width:92px; flex-shrink:0; color:var(--teal-deep);}
  .today-row .name{font-size:.9rem;}

  .card{
    background:var(--paper-raised); border-radius:12px; padding:14px 16px;
    box-shadow:var(--shadow); margin-bottom:12px; border-left:4px solid var(--ink-soft);
    animation:fadein .2s ease; position:relative;
  }
  .card.notice{border-left-color:var(--gold-deep);}
  .card.warning{border-left-color:var(--crimson); background:linear-gradient(0deg,var(--crimson-tint),var(--crimson-tint)), var(--paper-raised);}
  .card .t{font-weight:600; margin-bottom:4px; padding-right:56px;}
  .card .b{font-size:.87rem; color:var(--ink-soft); line-height:1.45; white-space:pre-wrap;}
  .card .d{font-size:.72rem; color:var(--ink-soft); margin-top:8px;}
  .card-admin-actions{position:absolute; top:12px; right:12px; display:flex; gap:6px;}
  .icon-btn{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--paper);
    font-size:.8rem; display:flex; align-items:center; justify-content:center; transition:transform .1s;
  }
  .icon-btn:active{transform:scale(.88);}

  .subject-row{
    display:flex; align-items:center; gap:14px; background:var(--paper-raised);
    border-radius:12px; padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow);
    transition:transform .1s; position:relative;
  }
  .subject-row:active{transform:scale(.98);}
  .subject-row .emoji{font-size:1.6rem; width:38px; text-align:center;}
  .subject-row .info{flex:1;}
  .subject-row .name{font-weight:600; font-size:.98rem;}
  .subject-row .count{font-size:.76rem; color:var(--ink-soft); margin-top:1px;}
  .subject-row .chev{color:var(--teal-deep); font-size:1.1rem;}

  .back-row{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .back-btn{
    display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--teal-deep);
    font-weight:600; font-size:.9rem; padding:4px 0;
  }
  .subject-detail-head{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .subject-detail-head .emoji{font-size:2.1rem;}
  .lecture-row{
    background:var(--paper-raised); border-radius:12px; padding:13px 14px; margin-bottom:10px;
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap;
  }
  .lecture-row .t{font-weight:500; font-size:.9rem; flex:1; min-width:140px;}
  .pdf-btn{
    background:var(--teal); color:#fff; border:none; border-radius:8px; padding:7px 12px;
    font-size:.78rem; font-weight:600; text-decoration:none; white-space:nowrap; cursor:pointer;
    font-family:inherit;
  }
  .pdf-btn.disabled{background:var(--line); color:var(--ink-soft); pointer-events:none;}
  .upload-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .upload-toggle button{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--paper-raised);
    font-size:.82rem; font-weight:600; color:var(--ink-soft);
  }
  .upload-toggle button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .file-hint{font-size:.72rem; color:var(--ink-soft); margin-top:5px;}
  .file-picked{font-size:.82rem; margin-top:6px; color:var(--teal-deep); font-weight:600;}

  .day-group{margin-bottom:20px;}
  .day-title{font-size:.95rem; font-weight:600; margin:0 0 8px; color:var(--teal-deep);}
  .period-row{
    display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);
  }
  .period-row:last-child{border-bottom:none;}
  .period-row .time{font-size:.8rem; font-weight:600; width:100px; flex-shrink:0; color:var(--ink-soft);}
  .period-row .name{font-size:.92rem; flex:1;}
  .period-row .acts{display:flex; gap:6px;}

  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center;
  }
  .nav-inner{
    display:flex; width:100%; max-width:520px; background:var(--ink);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1; background:none; border:none; color:#B9C4D6; padding:8px 2px;
    display:flex; flex-direction:column; align-items:center; gap:3px; border-radius:12px 12px 0 0;
    transition:transform .18s ease, background .18s ease, color .18s ease;
    font-size:.66rem; font-weight:600;
  }
  .tab-btn .ic{font-size:1.25rem; line-height:1;}
  .tab-btn.active{
    color:#fff; background:var(--gold-deep); transform:translateY(-8px);
  }
  .tab-btn.active.warnings-active{background:var(--crimson);}
  .tab-btn.active.subjects-active{background:var(--teal-deep);}

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(22,35,58,.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:520px; background:var(--paper); border-radius:20px 20px 0 0;
    padding:10px 20px calc(24px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .25s cubic-bezier(.32,.72,0,1);
  }
  .sheet-backdrop.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:8px auto 14px;}
  .sheet h3{margin:0 0 14px; font-size:1.15rem;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:.78rem; font-weight:600; margin-bottom:5px; color:var(--ink-soft);}
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-raised); font-family:inherit; font-size:.92rem; color:var(--ink);
  }
  .field textarea{min-height:80px; resize:vertical;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{
    padding:11px 16px; border-radius:10px; border:none; font-weight:600; font-size:.9rem; flex:1;
    transition:transform .1s;
  }
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--ink); color:#fff;}
  .btn.ghost{background:var(--line); color:var(--ink);}
  .btn.danger{background:var(--crimson); color:#fff;}
  .btn.full{width:100%;}
  .btn:disabled{opacity:.6; pointer-events:none;}

  .admin-menu-item{
    display:flex; align-items:center; justify-content:space-between; padding:14px 4px;
    border-bottom:1px solid var(--line); font-size:.92rem; font-weight:500; cursor:pointer;
  }
  .admin-menu-item:last-child{border-bottom:none;}
  .admin-menu-item .arrow{color:var(--ink-soft);}

  .loading{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:.9rem;
  }
  .loading .spinner{
    width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--teal);
    border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  #toast{
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:.85rem;
    box-shadow:var(--shadow); z-index:60; opacity:0; pointer-events:none; transition:all .25s ease;
    font-weight:500; white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="titles">
      <h1 id="headerTitle">Class Portal</h1>
      <div class="sub"><span id="modeBadge" class="mode-badge">Student</span><span id="todayLabel"></span></div>
    </div>
    <button class="gear-btn" id="gearBtn" title="Admin">⚙️</button>
  </header>

  <main id="main"></main>

  <nav class="bottom">
    <div class="nav-inner">
      <button class="tab-btn" data-tab="home"><span class="ic">🏠</span>Home</button>
      <button class="tab-btn" data-tab="notices"><span class="ic">📢</span>Notices</button>
      <button class="tab-btn" data-tab="warnings"><span class="ic">⚠️</span>Warnings</button>
      <button class="tab-btn" data-tab="subjects"><span class="ic">🎓</span>Subjects</button>
      <button class="tab-btn" data-tab="schedule"><span class="ic">📅</span>Schedule</button>
    </div>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet" id="sheetContent"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ================================================================
   CONFIG
   ================================================================ */
const GH_USER = "suzurishuhei";
const GH_REPO = "5th";
const GH_BRANCH = "main";
const DATA_PATH = "data";
const PDF_PATH = "pdfs";
const LS_TOKEN_KEY = "gh_token_5th";

/* ================================================================
   STATE
   ================================================================ */
let state = {
  notices: [],
  warnings: [],
  subjects: [],
  schedule: []
};
let currentTab = "home";
let isAdmin = false;
let subjectDetailId = null;
let ghToken = localStorage.getItem(LS_TOKEN_KEY) || "";

/* ================================================================
   HELPERS
   ================================================================ */
function todayStr(){
  return new Date().toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' });
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function utf8ToB64(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64ToUtf8(str){ return decodeURIComponent(escape(atob(str.replace(/\s/g,'')))); }

/* ================================================================
   TOAST
   ================================================================ */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ================================================================
   GITHUB API
   ================================================================ */
function ghHeaders(){
  return {
    "Authorization": `Bearer ${ghToken}`,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
    "Content-Type": "application/json"
  };
}

/* === READ: public via raw.githubusercontent.com — works for everyone === */
async function ghGetFile(path){
  const rawUrl = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/${GH_BRANCH}/${path}?t=${Date.now()}`;
  try{
    const res = await fetch(rawUrl);
    if(res.status === 404) return { content: null, sha: null };
    if(!res.ok) return { content: null, sha: null };
    const text = await res.text();
    let parsed = null;
    try { parsed = JSON.parse(text); } catch(e){ parsed = null; }
    // Only fetch sha when logged in as admin (needed for writes)
    let sha = null;
    if(ghToken && isAdmin){
      try{
        const meta = await fetch(
          `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`,
          { headers: ghHeaders() }
        );
        if(meta.ok){ const j = await meta.json(); sha = j.sha; }
      }catch(e){}
    }
    return { content: parsed, sha };
  }catch(e){
    console.warn("ghGetFile failed", path, e);
    return { content: null, sha: null };
  }
}

/* === WRITE: requires admin token === */
async function ghPutFile(path, contentObj, sha, message){
  const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`;
  const body = {
    message: message || `update ${path}`,
    content: utf8ToB64(JSON.stringify(contentObj, null, 2)),
    branch: GH_BRANCH
  };
  if(sha) body.sha = sha;
  const res = await fetch(url, {
    method: "PUT",
    headers: ghHeaders(),
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.message || `PUT ${path} failed (${res.status})`);
  }
  return res.json();
}

async function ghPutBinary(path, base64Content, sha, message){
  const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`;
  const body = {
    message: message || `upload ${path}`,
    content: base64Content,
    branch: GH_BRANCH
  };
  if(sha) body.sha = sha;
  const res = await fetch(url, {
    method: "PUT",
    headers: ghHeaders(),
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.message || `PUT ${path} failed (${res.status})`);
  }
  return res.json();
}

async function saveDataType(key){
  const path = `${DATA_PATH}/${key}.json`;
  const { sha } = await ghGetFile(path);
  await ghPutFile(path, state[key], sha, `update ${key} (admin)`);
}

/* ================================================================
   LOAD DATA
   ================================================================ */
async function loadAllData(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Loading class data…
    </div>`;

  const keys = ["notices","warnings","subjects","schedule"];
  const results = await Promise.all(keys.map(async k => {
    try{
      const { content } = await ghGetFile(`${DATA_PATH}/${k}.json`);
      return [k, content || []];
    }catch(e){
      console.warn("load error", k, e);
      return [k, []];
    }
  }));
  results.forEach(([k,v]) => { state[k] = v; });
}

/* ================================================================
   NAV
   ================================================================ */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.dataset.tab;
    subjectDetailId = null;
    render();
  });
});
document.getElementById('gearBtn').addEventListener('click', openAdminSheet);

function updateNavHighlight(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.classList.remove('active','warnings-active','subjects-active');
    if(btn.dataset.tab === currentTab){
      btn.classList.add('active');
      if(currentTab === 'warnings') btn.classList.add('warnings-active');
      if(currentTab === 'subjects') btn.classList.add('subjects-active');
    }
  });
}

function updateHeader(){
  document.getElementById('todayLabel').textContent = "· " + new Date().toLocaleDateString('en-US',{weekday:'long'});
  const badge = document.getElementById('modeBadge');
  badge.textContent = isAdmin ? "Admin" : "Student";
  badge.classList.toggle('admin', isAdmin);
}

/* ================================================================
   RENDER
   ================================================================ */
function render(){
  updateNavHighlight();
  updateHeader();
  const main = document.getElementById('main');
  main.innerHTML = "";
  const page = document.createElement('div');
  page.className = 'page';
  if(currentTab === 'home') page.innerHTML = renderHome();
  else if(currentTab === 'notices') page.innerHTML = renderFeed('notices');
  else if(currentTab === 'warnings') page.innerHTML = renderFeed('warnings');
  else if(currentTab === 'subjects') page.innerHTML = subjectDetailId ? renderSubjectDetail() : renderSubjects();
  else if(currentTab === 'schedule') page.innerHTML = renderSchedule();
  main.appendChild(page);
  bindPageEvents();
}

function renderHome(){
  const lectureCount = state.subjects.reduce((sum,s)=> sum + (s.lectures||[]).length, 0);
  const latest = state.notices[0];
  const today = new Date().toLocaleDateString('en-US',{weekday:'long'});
  const todays = state.schedule.filter(p=>p.day===today).sort((a,b)=>a.start.localeCompare(b.start));

  return `
    <div class="welcome">
      <h2>Hey, here's what's up</h2>
      <p>A quick snapshot of everything happening in class.</p>
    </div>
    <div class="stat-strip">
      <div class="stat"><span class="num">${state.subjects.length}</span><span class="lbl">Subjects</span></div>
      <div class="stat"><span class="num">${lectureCount}</span><span class="lbl">Lectures</span></div>
      <div class="stat"><span class="num">${state.notices.length}</span><span class="lbl">Notices</span></div>
      <div class="stat"><span class="num">${state.warnings.length}</span><span class="lbl">Warnings</span></div>
    </div>
    <p class="section-label">📢 Latest announcement</p>
    ${latest ? `
      <div class="preview-card">
        <div class="t">${esc(latest.title)}</div>
        <div class="b">${esc(latest.body)}</div>
        <div class="d">${esc(latest.date || '')}</div>
      </div>` : `<p class="empty-note">No announcements yet.</p>`}
    <p class="section-label">📅 Today — ${today}</p>
    ${todays.length ? todays.map(p=>`
      <div class="today-row">
        <div class="time">${esc(p.start)} – ${esc(p.end)}</div>
        <div class="name">${esc(p.name)}</div>
      </div>`).join('') : `<p class="empty-note">No classes scheduled today.</p>`}
  `;
}

function renderFeed(type){
  const items = [...state[type]].sort((a,b)=> (b._ts||0) - (a._ts||0));
  const label = type === 'notices' ? '📢 Notices' : '⚠️ Warnings';
  const cardClass = type === 'notices' ? 'notice' : 'warning';
  const emptyMsg = type === 'notices' ? "No notices yet." : "No warnings right now.";

  const addBtn = isAdmin ? `<button class="btn primary full" style="margin-bottom:16px" data-action="add-${type === 'notices' ? 'notice' : 'warning'}">+ Add ${type === 'notices' ? 'notice' : 'warning'}</button>` : '';

  if(items.length === 0){
    return `<p class="section-label">${label}</p>${addBtn}<p class="empty-note">${emptyMsg}</p>`;
  }
  return `

/* ================================================================
   EVENTS
   ================================================================ */
function bindPageEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', handleAction);
  });
}

function handleAction(e){
  const action = e.currentTarget.dataset.action;
  const id = e.currentTarget.dataset.id;
  const subjectId = e.currentTarget.dataset.subject;

  switch(action){
    case 'open-subject': subjectDetailId = id; render(); break;
    case 'back-to-subjects': subjectDetailId = null; render(); break;

    case 'add-notice': openItemForm('notices'); break;
    case 'edit-notice': openItemForm('notices', id); break;
    case 'delete-notice': confirmDelete('notices', id); break;

    case 'add-warning': openItemForm('warnings'); break;
    case 'edit-warning': openItemForm('warnings', id); break;
    case 'delete-warning': confirmDelete('warnings', id); break;

    case 'add-subject': openSubjectForm(); break;
    case 'edit-subject': openSubjectForm(id); break;
    case 'delete-subject': confirmDeleteSubject(id); break;

    case 'add-lecture': openLectureForm(subjectDetailId); break;
    case 'edit-lecture': openLectureForm(subjectId, id); break;
    case 'delete-lecture': confirmDeleteLecture(subjectId, id); break;

    case 'add-period': openPeriodForm(); break;
    case 'edit-period': openPeriodForm(id); break;
    case 'delete-period': confirmDeletePeriod(id); break;
  }
}

const MAX_PDF_BYTES = 4 * 1024 * 1024;

function openLectureForm(subjId, lecId){
  const subj = state.subjects.find(x=>x.id===subjId);
  if(!subj) return;
  const editing = !!lecId;
  const item = editing ? (subj.lectures||[]).find(x=>x.id===lecId) : null;
  const startMode = item && item.pdfUrl ? 'link' : 'upload';

  openSheet(`
    <h3>${editing ? 'Edit' : 'Add'} lecture</h3>
    <div class="field">
      <label>Title</label>
      <input id="fTitle" value="${item ? esc(item.title) : ''}" placeholder="e.g. Lecture 3 — Kinematics">
    </div>
    <div class="field">
      <label>PDF (optional)</label>
      <div class="upload-toggle">
        <button type="button" id="modeUpload" class="${startMode==='upload'?'active':''}">Upload file</button>
        <button type="button" id="modeLink" class="${startMode==='link'?'active':''}">Paste link</button>
      </div>
      <div id="uploadPane" class="${startMode==='upload'?'':'hidden'}">
        <input type="file" id="fPdfFile" accept="application/pdf">
        <div class="file-hint">Up to ~4MB. Larger files: use a link (Google Drive, etc.)</div>
        <div class="file-picked" id="filePicked">${item && item.pdfPath ? '📄 Current file: ' + esc(item.pdfPath) : ''}</div>
      </div>
      <div id="linkPane" class="${startMode==='link'?'':'hidden'}">
        <input id="fPdf" value="${item && item.pdfUrl ? esc(item.pdfUrl) : ''}" placeholder="https://...">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="fCancel">Cancel</button>
      <button class="btn primary" id="fSave">Save & publish</button>
    </div>
  `);

  document.getElementById('modeUpload').onclick = ()=>{
    document.getElementById('modeUpload').classList.add('active');
    document.getElementById('modeLink').classList.remove('active');
    document.getElementById('uploadPane').classList.remove('hidden');
    document.getElementById('linkPane').classList.add('hidden');
  };
  document.getElementById('modeLink').onclick = ()=>{
    document.getElementById('modeLink').classList.add('active');
    document.getElementById('modeUpload').classList.remove('active');
    document.getElementById('linkPane').classList.remove('hidden');
    document.getElementById('uploadPane').classList.add('hidden');
  };

  document.getElementById('fCancel').onclick = closeSheet;
  document.getElementById('fSave').onclick = async ()=>{
    const title = document.getElementById('fTitle').value.trim();
    if(!title){ toast("Add a title first"); return; }

    const uploadMode = document.getElementById('modeUpload').classList.contains('active');
    const file = uploadMode ? document.getElementById('fPdfFile').files[0] : null;
    const pdfUrl = uploadMode ? '' : document.getElementById('fPdf').value.trim();

    const btn = document.getElementById('fSave');
    const lecId = editing ? item.id : uid();
    const newLec = editing ? { ...item } : { id: lecId, title };
    newLec.title = title;

    if(!uploadMode){
      newLec.pdfUrl = pdfUrl;
      delete newLec.pdfPath;
    }

    btn.textContent = "Uploading…"; btn.disabled = true;

    try{
      if(file){
        if(file.type !== 'application/pdf'){ throw new Error("Please choose a PDF file"); }
        if(file.size > MAX_PDF_BYTES){ throw new Error("That file's too big — try a link"); }
        const base64 = await fileToBase64(file);
        const safeName = (title.replace(/[^a-z0-9]+/gi,'_').toLowerCase()).slice(0,40) || 'file';
        const pdfPath = `${PDF_PATH}/${subjId}/${lecId}_${safeName}.pdf`;
        let existingSha = null;
        try{
          const r = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${pdfPath}?ref=${GH_BRANCH}`, { headers: ghHeaders() });
          if(r.ok){ const j = await r.json(); existingSha = j.sha; }
        }catch(e){}
        await ghPutBinary(pdfPath, base64, existingSha, `upload PDF for lecture ${lecId}`);
        newLec.pdfPath = pdfPath;
        delete newLec.pdfUrl;
      }

      if(editing){
        subj.lectures = (subj.lectures||[]).map(x => x.id === lecId ? newLec : x);
      } else {
        subj.lectures = subj.lectures || [];
        subj.lectures.push(newLec);
      }
      await saveDataType('subjects');

      closeSheet(); toast(editing ? "✅ Saved" : "✅ Added"); render();
    }catch(err){
      console.error(err);
      toast("❌ " + err.message);
      btn.textContent = "Save & publish"; btn.disabled = false;
    }
  };
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const s = String(reader.result);
      const comma = s.indexOf(',');
      resolve(s.slice(comma+1));
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    }catch(err){
      toast("❌ Failed: " + err.message);
      btn.textContent = "Delete"; btn.disabled = false;
    }
  };
}

(async function init(){
  if(ghToken){
    try{
      const r = await fetch("https://api.github.com/user", { headers: ghHeaders() });
      if(r.ok) isAdmin = true;
    }catch(e){}
  }
  await loadAllData();
  render();
})();
</script>
